# A database for `uv run pytest` and for running the service by hand:
#   docker compose up -d && export DATABASE_URL=postgresql://postgres@localhost:5432/postgres
# Without Docker the tests start a throwaway cluster from a local PostgreSQL install instead.
services:
  postgres:
    image: postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
