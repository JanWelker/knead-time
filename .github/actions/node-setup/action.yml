name: Node setup
description: >-
  Install the repo's Node version and its dependencies. Every job needs the
  same three lines, and the version lives in .nvmrc so Renovate can see it —
  a `node-version:` literal in a workflow is invisible to every manager it has.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm

    - run: npm ci
      shell: bash
