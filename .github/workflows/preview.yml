name: PR preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

# rossjrw/pr-preview-action@v1.8.1 still pins JamesIves/github-pages-deploy-action
# v4.7.4 and marocchino/sticky-pull-request-comment v2.9.2, both declaring
# `using: node20` — a runtime GitHub retired on 2026-06-02. The flag opts them
# onto Node 24 explicitly rather than relying on the forced migration to do it.
# Remove once upstream re-pins; Renovate bumps the action, not the runtime
# inside it, so this has to be re-checked by hand when that PR lands.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  preview:
    # Fork PRs get a read-only GITHUB_TOKEN regardless of the permissions
    # block above, so the gh-pages push would fail with a red X on every
    # external contribution. Skip the job cleanly for forks.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # A hung gh-pages push would otherwise hold the shared group for GitHub's
    # six-hour default and take the production deploy down with it.
    timeout-minutes: 15
    concurrency:
      # Shared with deploy.yml, because both push to gh-pages and a merge fires
      # both at once: the deploy of main, and this workflow's `closed` run
      # cleaning the preview up. The deploy force-pushes while this one rebases,
      # so unserialised the two either clobber each other or fail
      # non-fast-forward. `cancel-in-progress: false` serialises them, but it is
      # not a queue: GitHub keeps at most one running and one pending job per
      # group, and a third job arriving cancels the one that was pending. A
      # build of another PR landing while this cleanup waits behind a deploy
      # therefore still cancels the cleanup, and the closed PR's directory stays
      # on gh-pages with no later run to remove it — the residual risk, fixed by
      # hand (delete `pr-preview/pr-<n>` on gh-pages). The per-PR group above
      # still cancels a superseded build of the same PR.
      group: gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/node-setup
        if: github.event.action != 'closed'

      - name: Resolve base path
        id: base
        if: github.event.action != 'closed'
        uses: ./.github/actions/base-path
        with:
          subdir: /pr-preview/pr-${{ github.event.number }}

      - name: Build
        if: github.event.action != 'closed'
        env:
          BASE_PATH: ${{ steps.base.outputs.value }}
        run: npm run build

      - name: Deploy preview
        # Pins JamesIves/github-pages-deploy-action v4.7.4 inside itself, while
        # deploy.yml runs v4.9.0 against the same branch. Renovate cannot see the
        # nested pin; renovate.json groups the two actions so a bump of either
        # is the prompt to compare them.
        uses: rossjrw/pr-preview-action@ffa7509e91a3ec8dfc2e5536c4d5c1acdf7a6de9 # v1.8.1
        with:
          source-dir: build
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
