---
# The check the ruleset on main requires. It waits for every other check on
# the head commit; the logic lives in JanWelker/renovate-config.
name: CI OK

'on':
  pull_request:

permissions:
  checks: read

concurrency:
  group: ci-ok-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci-ok:
    uses: JanWelker/renovate-config/.github/workflows/wait-for-checks.yaml@ed5e68f3114201d9f409950f680f4ff93dafa458 # v1.0.0
