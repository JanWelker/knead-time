---
# The check the ruleset on main requires. It waits for every other check on
# the head commit; the logic lives in JanWelker/renovate-config.
name: CI OK

'on':
  pull_request:

permissions:
  checks: read
  statuses: read

concurrency:
  group: ci-ok-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci-ok:
    uses: JanWelker/renovate-config/.github/workflows/wait-for-checks.yaml@afcf04366e80bf2315cba3e84c14c16d9616fc6a # v1.5.1
