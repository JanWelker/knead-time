---
# The check the ruleset on main requires. It waits for every other check on
# the head commit; the logic lives in JanWelker/renovate-config.
name: CI OK

'on':
  pull_request:

permissions:
  checks: read
  statuses: read

concurrency:
  group: ci-ok-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci-ok:
    uses: JanWelker/renovate-config/.github/workflows/wait-for-checks.yaml@51c8fcbcbd06395dd0080bbd2ac7c298329a88ae # v1.3.1
