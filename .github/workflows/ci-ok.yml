---
# The check the ruleset on main requires. It waits for every other check on
# the head commit; the logic lives in JanWelker/renovate-config.
name: CI OK

'on':
  pull_request:

permissions:
  checks: read
  statuses: read

concurrency:
  group: ci-ok-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci-ok:
    uses: JanWelker/renovate-config/.github/workflows/wait-for-checks.yaml@59de31fc0a3796828a41f997f7746a79dff3f9ec # v1.3.0
