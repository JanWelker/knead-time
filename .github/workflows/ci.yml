name: CI

# Pushes to main are included so Codecov gets a main-branch baseline —
# the README badge points at branch/main, which PR-only runs never feed.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # PR runs supersede each other; runs on main must not. deploy.yml is gated on
  # a successful CI run for the commit, so cancelling the first of two merges
  # that land close together would leave that commit undeployed, untagged and
  # missing from the Codecov main baseline.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    # Nothing here should take a quarter of this; the cap is against a wedged
    # step holding a runner (and a required check) for GitHub's six-hour default.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/node-setup

      - run: npm run lint

      - run: npm run check

      - run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const c = require("./coverage/coverage-summary.json").total;
              const pct = (k) => `${c[k].pct.toFixed(2)}% (${c[k].covered}/${c[k].total})`;
              const md = [
                "## Test coverage",
                "",
                "| Metric | Coverage |",
                "|---|---|",
                `| Lines | ${pct("lines")} |`,
                `| Statements | ${pct("statements")} |`,
                `| Functions | ${pct("functions")} |`,
                `| Branches | ${pct("branches")} |`,
                ""
              ].join("\n");
              require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
            '
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - run: npm run build

  # Separate job so a browser failure reads as a browser failure, and so it runs
  # alongside the unit gate rather than after it. Covers what vitest cannot: the
  # controls live in .svelte / .svelte.ts, which have no Svelte plugin in the
  # vitest config — `$state` is not even defined there.
  e2e:
    runs-on: ubuntu-latest
    # A hung `vite preview` under Playwright is the likeliest way to lose a
    # runner for six hours; the suite itself runs in a few minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/node-setup

      # The browser download is the slowest step in this job and changes only
      # when Playwright does, so key the cache on the version the lockfile
      # resolves (Renovate bumps that file, so the key follows on its own).
      - name: Resolve Playwright version
        id: playwright-version
        run: |
          VERSION=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.value }}

      # Chromium only: the suite asserts layout geometry and copy, not engine
      # differences, and a second browser would double the wall clock for no
      # extra signal.
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      # Only ~/.cache/ms-playwright is cached; the OS libraries the browser links
      # against are installed system-wide and are not, so they still have to be
      # laid down on a hit.
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Refuses a change that quietly removes tests, in either suite, or that
      # relaxes the coverage gate. Collects without running, so it is quick and
      # fails before the long suite rather than after it.
      - run: npm run test:baseline

      # Builds and serves the real static output — see playwright.config.ts.
      - run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
