name: CI

# Pushes to main are included so Codecov gets a main-branch baseline —
# the README badge points at branch/main, which PR-only runs never feed.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/node-setup

      - run: npm run lint

      - run: npm run check

      - run: npm run test:coverage

      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const c = require("./coverage/coverage-summary.json").total;
              const pct = (k) => `${c[k].pct.toFixed(2)}% (${c[k].covered}/${c[k].total})`;
              const md = [
                "## Test coverage",
                "",
                "| Metric | Coverage |",
                "|---|---|",
                `| Lines | ${pct("lines")} |`,
                `| Statements | ${pct("statements")} |`,
                `| Functions | ${pct("functions")} |`,
                `| Branches | ${pct("branches")} |`,
                ""
              ].join("\n");
              require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, md);
            '
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - run: npm run build

  # Separate job so a browser failure reads as a browser failure, and so it runs
  # alongside the unit gate rather than after it. Covers what vitest cannot: the
  # controls live in .svelte / .svelte.ts, which have no Svelte plugin in the
  # vitest config — `$state` is not even defined there.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/node-setup

      # Chromium only: the suite asserts layout geometry and copy, not engine
      # differences, and a second browser would double the wall clock for no
      # extra signal.
      - run: npx playwright install --with-deps chromium

      # Refuses a change that quietly removes tests, in either suite, or that
      # relaxes the coverage gate. Collects without running, so it is quick and
      # fails before the long suite rather than after it.
      - run: npm run test:baseline

      # Builds and serves the real static output — see playwright.config.ts.
      - run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
