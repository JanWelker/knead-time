name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # Guard workflow_dispatch: dispatching from a feature branch would deploy
    # unreviewed code and mint the v<version> tag on a non-main commit.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/node-setup

      - name: Resolve base path
        id: base
        uses: ./.github/actions/base-path

      - name: Build
        env:
          BASE_PATH: ${{ steps.base.outputs.value }}
        run: npm run build

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: build
          branch: gh-pages
          clean: true
          # Preserve PR preview subdirectories published by preview.yml.
          clean-exclude: |
            pr-preview/**

      - name: Tag release
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          # Idempotent: every push to main runs this job, but we only tag
          # when package.json has been bumped to a version we haven't tagged.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on origin, skipping."
            exit 0
          fi
          git tag "$TAG"
          git push origin "$TAG"
