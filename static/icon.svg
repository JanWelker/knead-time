<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Knead Time">
	<!-- The mark is the thing the app hands you: a job ticket, printed. Every
	     device on it is one the page already uses — the sheet standing on a
	     solid block of ink the way a second pass sits beside the first when the
	     plate is out of register, dotted leaders walking a value to its figure,
	     and the perforation the ingredient stub tears off at. The bites punched
	     out of it are the reason the block is not symmetrical: on the left the
	     bite is wider than the ink beside it and punches through to the stock,
	     on the right it stays inside the block. One spot of tomato below the
	     tear is the only colour, which is what makes it read at 32 px. -->
	<rect width="512" height="512" fill="#efe7d5" />
	<rect x="88" y="48" width="336" height="416" fill="#1a1613" />
	<rect x="102" y="62" width="288" height="368" fill="#fbf7ef" />
	<g stroke="#1a1613" stroke-width="12">
		<path d="M133 101H306" stroke-dasharray="12 14" />
		<path d="M133 139H306" stroke-dasharray="12 14" />
		<path d="M102 303H390" stroke-dasharray="22 16" />
	</g>
	<rect x="330" y="92" width="18" height="18" fill="#1a1613" />
	<rect x="330" y="130" width="18" height="18" fill="#1a1613" />
	<circle cx="102" cy="303" r="20" fill="#efe7d5" />
	<circle cx="390" cy="303" r="20" fill="#1a1613" />
	<circle cx="246" cy="365" r="34" fill="#c8401a" />
</svg>
