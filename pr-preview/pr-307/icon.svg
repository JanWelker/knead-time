<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Knead Time">
	<!-- The home-screen icon is a printed label: paper stock, one hard ink rule
	     inset from the trim, and the shop's mark struck in the middle. Same mark
	     as favicon.svg, drawn in the same 64-unit space and scaled here, so the
	     tab and the home screen are recognisably the same app. The toppings sit
	     at 12/3/6/9 — it is a clock as much as a pizza, which is the whole app. -->
	<rect width="512" height="512" fill="#efe7d5" />
	<rect x="35" y="35" width="442" height="442" fill="none" stroke="#1a1613" stroke-width="14" />
	<g transform="translate(256 256) scale(6.4) translate(-32 -32)">
		<circle cx="32" cy="32" r="28" fill="#f0d8a1" stroke="#a86d20" stroke-width="3" />
		<circle cx="32" cy="11" r="2.2" fill="#c8401a" />
		<circle cx="53" cy="32" r="2.2" fill="#c8401a" />
		<circle cx="32" cy="53" r="2.2" fill="#c8401a" />
		<circle cx="11" cy="32" r="2.2" fill="#c8401a" />
		<ellipse cx="46" cy="46" rx="3" ry="1.6" fill="#4a8d36" transform="rotate(-40 46 46)" />
		<ellipse cx="18" cy="46" rx="3" ry="1.6" fill="#4a8d36" transform="rotate(40 18 46)" />
		<line x1="32" y1="32" x2="22" y2="26" stroke="#5a3a18" stroke-width="3.2" stroke-linecap="round" />
		<line x1="32" y1="32" x2="46" y2="24" stroke="#5a3a18" stroke-width="2.4" stroke-linecap="round" />
		<circle cx="32" cy="32" r="2.5" fill="#5a3a18" />
	</g>
</svg>
