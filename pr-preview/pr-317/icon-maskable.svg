<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Knead Time">
	<!-- The same drawing as icon.svg — see the comment there for what each part
	     of the ticket is — at the maskable scale.

	     Android crops this to a circle, a squircle or whatever the launcher
	     fancies, and only the inner 80 % is guaranteed to survive. The ticket is
	     a rectangle, so it is its DIAGONAL that has to clear that circle, not
	     its width: the mark measures 246 by 358, which is 434 corner to corner
	     against the 410 the safe circle allows. Hence the 0.86, which brings it
	     to 374 and leaves the corners of the ink block a margin; anything above
	     0.94 lands outside the circle and a round crop shaves them. That 374 is
	     also exactly the size the maskable was before the mark was re-traced, so
	     an installed icon does not change size under anyone.

	     The stock runs full bleed to feed the crop. -->
	<rect width="512" height="512" fill="#efe7d5" />
	<g transform="translate(256 256) scale(0.86) translate(-256 -256)">
		<rect x="157" y="94" width="222" height="341" fill="#1a1613" />
		<path d="M133 83.5 L356.5 77 L356.5 418 L133 418 Z" fill="#1a1613" />
		<path d="M142.5 125 L350 118.5 L355.5 409 L142.5 409 Z" fill="#fbf7ef" />
		<g stroke="#1a1613" fill="none">
			<g stroke-width="4" stroke-dasharray="4 5.4">
				<path d="M163.5 155.5H309" />
				<path d="M163.5 185.5H309" />
			</g>
			<path d="M157.5 310.5H323" stroke-width="5" stroke-dasharray="16.5 7.5" />
		</g>
		<rect x="316.5" y="143.5" width="13.5" height="14" fill="#1a1613" />
		<rect x="316.5" y="173.5" width="13.5" height="13.5" fill="#1a1613" />
		<circle cx="142.5" cy="310.5" r="15.5" fill="#efe7d5" />
		<circle cx="354" cy="310.5" r="23" fill="#1a1613" />
		<circle cx="250" cy="360" r="26" fill="#c8401a" />
	</g>
</svg>
